for(let i=0;i<5;i++){
  const x=ML+PW*i;
  el("line",{x1:x,y1:PY,x2:x+PW-16,y2:PY,stroke:INK,"stroke-width":1,opacity:".12"},L_UI);
  const f=el("line",{x1:x,y1:PY,x2:x,y2:PY,stroke:ACC,"stroke-width":1.6},L_UI);
  const n=el("text",{x:x,y:PY-14,class:"mn","font-size":"11","letter-spacing":"2",
    fill:DIM},L_UI); n.textContent="0"+(i+1);
  const t=el("text",{x:x,y:PY+22,class:"mn","font-size":"11","letter-spacing":"1.4",
    fill:DIM},L_UI); t.textContent=CH[i+1].dom;
  marks.push({f:f,n:n,t:t,x:x,w:PW-16});
}
rule(ML,764,MR,".12");
["SECURE & COMPLIANT DATA","INTEGRATED MULTI-OMICS","AI & MACHINE LEARNING ENGINE",
 "PRIVACY & REGULATORY COMPLIANCE","SCALABLE & GLOBALLY CONNECTED"].forEach((t,i)=>{
  const w=(MR-ML)/5, x=ML+w*i+w/2;
  el("text",{x:x,y:790,"text-anchor":"middle",class:"mn","font-size":"9.6",
    "letter-spacing":"1.2",fill:DIM},L_UI).textContent=t;
  if(i)el("line",{x1:ML+w*i,y1:776,x2:ML+w*i,y2:796,stroke:INK,"stroke-width":1,
    opacity:".1"},L_UI);});
el("text",{x:ML,y:824,class:"mn","font-size":"10.5","letter-spacing":"2.4",fill:MID},L_UI)
  .textContent="FLOPEXA BIOLOGICAL INTELLIGENCE CLOUD";
el("text",{x:MR,y:824,"text-anchor":"end",class:"mn","font-size":"10.5",
  "letter-spacing":"2.4",fill:MID},L_UI)
  .textContent="ONE PLATFORM. SEVEN INTELLIGENCES. LIMITLESS POSSIBILITIES.";
[[52,52,1,1],[1548,52,-1,1],[52,848,1,-1],[1548,848,-1,-1]].forEach(q=>
  el("path",{d:"M"+(q[0]+q[2]*22)+" "+q[1]+"H"+q[0]+"V"+(q[1]+q[3]*22),fill:"none",
    stroke:INK,"stroke-width":1,opacity:".2"},L_UI));

/* ═════════ particle field ═════════ */
const BOK=[],DUST=[];
(function(){let n=7;const rnd=()=>{n=(n*1103515245+12345)&0x7fffffff;return n/0x7fffffff;};
 for(let i=0;i<48;i++)BOK.push({x:(rnd()-.5)*800,y:(rnd()-.5)*680,r:14+rnd()*58,
   a:.030+rnd()*.062,ph:rnd()*6.283,sp:.06+rnd()*.16});
 for(let i=0;i<250;i++){const c2=rnd()<.5;
   DUST.push({x:(rnd()-.5)*(c2?360:880),y:(rnd()-.5)*(c2?620:720),r:.5+rnd()*1.8,
     a:.12+rnd()*.55,ph:rnd()*6.283,sp:.10+rnd()*.30,d:rnd()<.20});}})();
const P=[];
for(let i=0;i<N;i++)P.push({x:FX+(Math.random()-.5)*900,y:FY+(Math.random()-.5)*700,
  z:0,vx:0,vy:0,ph:Math.random()*6.283,sp:.6+Math.random()*.7,sz:.5+Math.random()});
let cur=0,prev=0,mix=1,tCol=hx(CH[0].c),T=0,C=0,sTarget=0,scrolled=false;
let mx=0,my=0,tmx=0,tmy=0,PLX=0,PLY=0;
addEventListener("pointermove",e=>{tmx=(e.clientX/innerWidth-.5)*2;tmy=(e.clientY/innerHeight-.5)*2;},{passive:true});

let HA=0,HB=1,HT=0;
function target(i,st){
  if(st==="helix")return helixTarget(i);
  if(st==="micro")return microTarget(i);
  if(st==="molecule")return molTarget(i);
  if(st==="cell")return cellTarget(i);
  if(st==="horse"){const a=HORSE[HA][i],b=HORSE[HB][i];
    return [lerp(a[0],b[0],HT),lerp(a[1],b[1],HT)];}
  return CLOUD[st][i];
}
function draw(dt){
  const st=STATES[cur],ps=STATES[prev];
  const hu=T/0.30; HA=Math.floor(hu)%HORSE.length; HB=(HA+1)%HORSE.length; HT=hu-Math.floor(hu);
  const col=mixr(CH[prev].c,CH[cur].c,easeIO(mix));
  fx.save();fx.setTransform(1,0,0,1,0,0);fx.clearRect(0,0,fxc.width,fxc.height);fx.restore();
  const em=easeIO(mix), DW={helix:1,cell:.58,molecule:.44};
  const dep=(DW[ps]||0)*(1-em)+(DW[st]||0)*em;
  const hw=(ps==="helix"?1:0)*(1-em)+(st==="helix"?1:0)*em;
  const Q=[];
  for(let i=0;i<N;i++){
    const p=P[i];
    const a=target(i,ps),b=target(i,st);
    const w=easeIO(clamp((mix-(i/N)*.26)/.74,0,1));
    const tx=FX+PLX+lerp(a[0],b[0],w), ty=FY+PLY+lerp(a[1],b[1],w);
    const tz=lerp(a[2]||0,b[2]||0,w);
    const k=Math.min(1,dt*lerp(3.0+p.sp*3.2,20+p.sp*11,easeIO(mix)));
    p.x+=(tx-p.x)*k; p.y+=(ty-p.y)*k; p.z+=(tz-p.z)*Math.min(1,dt*7);
    const dx=Math.sin(T*p.sp+p.ph)*0.85, dy=Math.cos(T*p.sp*.8+p.ph)*0.85;
    const d=Math.hypot(tx-p.x,ty-p.y), hot=clamp(d/70,0,1);
    const bl=clamp(Math.abs(p.z-.30)/1.50,0,1)*dep;       /* shallow DOF */
    const lit=i<NL?hw:0;                                 /* the core */
    const near=clamp(.55+.45*p.z,.26,1.6);
    const tw=lerp(1,.72+.28*Math.sin(T*3.1+p.ph*7),dep);
    const r=lerp(.85+p.sz*1.05,.62+p.sz*.8,dep)*(1+hot*.5)*(1+bl*3.1)*lerp(1,.72+.55*near,dep);
    const al=(.30+p.sz*.40+hot*.26)*lerp(1,(.05+1.42*near)*tw,dep)/(1+bl*2.6);
        const gl=(hw>.4&&near>.78&&bl<.18)?Math.max(0,Math.sin(T*1.5+p.ph*11)-.94)/.06:0;
    Q.push({x:p.x+dx,y:p.y+dy,z:p.z,r:r,a:al*(1+lit*1.1),l:lit,n:dep>0?near:0,b:bl,
      t:hw>.4?LBL[i]:0,g:gl,d:dep,h:hw});
  }
  if(hw>.02){                                            /* bokeh behind */
    for(const b of BOK){
      const bx=FX+PLX*1.5+b.x+Math.sin(T*b.sp+b.ph)*16, by=FY+PLY*1.5+b.y+Math.cos(T*b.sp*.8+b.ph)*12;
      fx.fillStyle="rgba("+col[0]+","+col[1]+","+col[2]+","+(b.a*hw*1.15).toFixed(3)+")";
      fx.beginPath();fx.arc(bx,by,b.r,0,6.2832);fx.fill();
      fx.strokeStyle="rgba(236,244,255,"+(b.a*hw*.45).toFixed(3)+")";fx.lineWidth=1.1;
      fx.beginPath();fx.arc(bx,by,b.r,0,6.2832);fx.stroke();}
  }
  if(hw>.02){
    fx.lineCap="round";
    for(let s2=0;s2<2;s2++){const b=BB[s2];
      for(let j=1;j<b.length;j++){
        const p0=P[b[j-1]],p1=P[b[j]];
        if(Math.hypot(p1.x-p0.x,p1.y-p0.y)>54)continue;
        const zz=(p0.z+p1.z)*.5, nn=clamp(.55+.45*zz,.26,1.6);
        const bb=clamp(Math.abs(zz-.30)/1.50,0,1);
        fx.strokeStyle="rgba("+col[0]+","+col[1]+","+col[2]+","+
          (hw*(.05+.62*nn)/(1+bb*3.6)).toFixed(3)+")";
        fx.lineWidth=(1.0+3.2*nn)*(1+bb*1.5);
        fx.beginPath();fx.moveTo(p0.x,p0.y);fx.lineTo(p1.x,p1.y);fx.stroke();}}
    for(let s3=0;s3<2;s3++){const b=BGB[s3];
      for(let j=1;j<b.length;j++){
        const p0=P[b[j-1]],p1=P[b[j]];
        if(Math.hypot(p1.x-p0.x,p1.y-p0.y)>90)continue;
        fx.strokeStyle="rgba("+col[0]+","+col[1]+","+col[2]+","+(hw*.030).toFixed(3)+")";
        fx.lineWidth=7;
        fx.beginPath();fx.moveTo(p0.x,p0.y);fx.lineTo(p1.x,p1.y);fx.stroke();}}
    for(let g2=0;g2<RGL.length;g2++){const b=RGL[g2];
      for(let j=1;j<b.length;j++){
        const p0=P[b[j-1]],p1=P[b[j]];
        if(Math.hypot(p1.x-p0.x,p1.y-p0.y)>300)continue;
        const zz=(p0.z+p1.z)*.5, nn=clamp(.55+.45*zz,.26,1.6);
        const bb=clamp(Math.abs(zz-.30)/1.50,0,1);
        fx.strokeStyle="rgba("+col[0]+","+col[1]+","+col[2]+","+
          (hw*(.10+.72*nn)/(1+bb*3.0)).toFixed(3)+")";
        fx.lineWidth=(.55+1.15*nn)*(1+bb*1.2);
        fx.beginPath();fx.moveTo(p0.x,p0.y);fx.lineTo(p1.x,p1.y);fx.stroke();}}
  }
  Q.sort((A,B)=>A.z-B.z);
  for(const q of Q){
    if(q.l>.35){
      fx.fillStyle="rgba(226,246,255,"+(q.a*.17).toFixed(3)+")";
      fx.beginPath();fx.arc(q.x,q.y,q.r*4,0,6.2832);fx.fill();
      fx.fillStyle="rgba(238,251,255,"+Math.min(1,q.a*1.3).toFixed(3)+")";
      fx.beginPath();fx.arc(q.x,q.y,q.r,0,6.2832);fx.fill();
      continue;}
    if(q.h>.02&&q.b<.55&&q.n>.45){
      fx.fillStyle="rgba(214,224,255,"+(q.a*q.h*.085).toFixed(3)+")";
      fx.beginPath();fx.arc(q.x,q.y,q.r*5.2,0,6.2832);fx.fill();}
    const m=q.d?Math.max(0,q.n-.28)*1.25:0, dk=q.d?Math.max(0,.5-q.n)*1.3*q.d:0;
    const R=Math.round(lerp(lerp(col[0],22,dk),238,m)),
          G=Math.round(lerp(lerp(col[1],64,dk),252,m)),
          B=Math.round(lerp(lerp(col[2],96,dk),255,m));
    fx.fillStyle="rgba("+R+","+G+","+B+","+Math.min(1,q.a).toFixed(3)+")";
    fx.beginPath();fx.arc(q.x,q.y,q.r,0,6.2832);fx.fill();
    if(q.b<.16&&q.n>.72){fx.fillStyle="rgba(255,255,255,"+(q.a*.85).toFixed(3)+")";
      fx.beginPath();fx.arc(q.x,q.y,q.r*.42,0,6.2832);fx.fill();}
    if(q.g>0){
      const L=q.r*(4+q.g*9);
      fx.strokeStyle="rgba(255,255,255,"+(q.g*.5).toFixed(3)+")";fx.lineWidth=.9;
      fx.beginPath();fx.moveTo(q.x-L,q.y);fx.lineTo(q.x+L,q.y);
      fx.moveTo(q.x,q.y-L);fx.lineTo(q.x,q.y+L);fx.stroke();}
    if(q.t&&q.b<.42&&q.n>.62){
      fx.font="500 12px 'IBM Plex Mono',ui-monospace,Menlo,monospace";fx.textAlign="center";
      fx.fillStyle="rgba(226,248,255,"+Math.min(.95,q.a*1.5).toFixed(3)+")";
      fx.fillText(q.t,q.x,q.y-7);}
  }
  if(hw>.02){                                            /* floating dust */
    for(const d of DUST){
      const dx2=FX+PLX*1.2+d.x+Math.sin(T*d.sp+d.ph)*22,
            dy2=FY+PLY*1.2+d.y+Math.cos(T*d.sp*.7+d.ph)*18;
      const aa=d.a*hw*(.55+.45*Math.sin(T*1.3+d.ph*3));
      fx.fillStyle=d.d?"rgba(244,250,255,"+(aa*1.5).toFixed(3)+")"
        :"rgba("+col[0]+","+col[1]+","+col[2]+","+aa.toFixed(3)+")";
      fx.beginPath();fx.arc(dx2,dy2,d.r,0,6.2832);fx.fill();}
  }
  if(hw>.02){                                             /* light on the core */
    const gx=FX+PLX-186,gy=FY+PLY-72,pu=1.05+.09*Math.sin(T*1.35);
    const g=fx.createRadialGradient(gx,gy,0,gx,gy,150*pu);
    g.addColorStop(0,"rgba(255,255,255,"+(.72*hw).toFixed(3)+")");
    g.addColorStop(.12,"rgba(206,222,255,"+(.20*hw).toFixed(3)+")");
    g.addColorStop(1,"rgba(150,220,255,0)");
    fx.fillStyle=g;fx.beginPath();fx.arc(gx,gy,150*pu,0,6.2832);fx.fill();
    fx.strokeStyle="rgba(236,244,255,"+(.30*hw).toFixed(3)+")";fx.lineWidth=1;
    fx.beginPath();fx.moveTo(gx-96*pu,gy);fx.lineTo(gx+96*pu,gy);
    fx.moveTo(gx,gy-70*pu);fx.lineTo(gx,gy+70*pu);fx.stroke();
  }
  fx.fillStyle="rgba("+col[0]+","+col[1]+","+col[2]+",.03)";
  fx.beginPath();fx.arc(FX+PLX*.6,FY+PLY*.6,330,0,6.2832);fx.fill();
}

/* ═════════ chapters from scroll ═════════ */
function setChapter(i){
  if(i===cur)return;
  prev=cur;cur=i;mix=0;
  const c=CH[i];
  chEye.textContent=c.key;
  chH.textContent=c.h[0]; chH2.textContent=c.h[1]||"";
  chLo.setAttribute("transform","translate(0,"+(c.h[1]?62:0)+")");
  chB1.textContent=c.b[0];chB2.textContent=c.b[1];
  chG.textContent=c.tag?("MARKER · "+c.tag):(c.dom||"");
  chEye.setAttribute("fill",c.c);chR.setAttribute("stroke",c.c);
  stName.textContent=c.dom||c.key;
}
function onScroll(){
  const max=document.documentElement.scrollHeight-innerHeight;
  sTarget=max>0?clamp(scrollY/max,0,1):0;
  if(!scrolled){scrolled=true;}
}
addEventListener("scroll",onScroll,{passive:true});
addEventListener("resize",onScroll);

let last=performance.now(),intro=0;
function fit2(){
  const s=document.getElementById("stage"),w=s.clientWidth,h=s.clientHeight;
  const dpr=Math.min(2,window.devicePixelRatio||1);
  fxc.width=Math.round(w*dpr);fxc.height=Math.round(h*dpr);
  const SC=Math.min(w/VW,h/VH),ox=(w-VW*SC)/2,oy=(h-VH*SC)/2;
  fx.setTransform(SC*dpr,0,0,SC*dpr,ox*dpr,oy*dpr);}
addEventListener("resize",fit2);fit2();
(function(){const n=document.createElement("canvas");n.width=n.height=140;
  const x=n.getContext("2d"),d=x.createImageData(140,140);
  for(let i=0;i<d.data.length;i+=4){const v=150+Math.random()*105;
    d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255;}
  x.putImageData(d,0,0);
  document.getElementById("grain").style.background="url("+n.toDataURL()+") repeat";})();

cur=-1;setChapter(0);prev=0;mix=1;
function loop(now){
  const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;
  T+=dt;intro+=dt;
  mx+=(tmx-mx)*Math.min(1,dt*2.6);my+=(tmy-my)*Math.min(1,dt*2.6);
  PLX=mx*17;PLY=my*12;
  C+=((scrolled?sTarget:Math.min(.02,intro*.004))-C)*Math.min(1,dt*4);
  const idx=clamp(Math.floor(C*CH.length*.999),0,CH.length-1);
  if(idx!==cur)setChapter(idx);
  mix=Math.min(1,mix+dt*.85);
  const io=ease(clamp(intro/1.3,0,1));
  L_UI.setAttribute("opacity",io.toFixed(2));
  capG.setAttribute("opacity",(easeIO(clamp(mix*1.6,0,1))*io).toFixed(3));
  chR.setAttribute("x2",(ML+112*easeIO(clamp(mix*1.4,0,1))).toFixed(1));
  marks.forEach((mk,i)=>{
    const seg=clamp(C*CH.length-1-i,0,1);
    mk.f.setAttribute("x2",(mk.x+mk.w*seg).toFixed(1));
    const on=cur===i+1;
    mk.f.setAttribute("stroke",CH[i+1].c);
    mk.n.setAttribute("fill",on?CH[i+1].c:DIM);mk.t.setAttribute("fill",on?INK:DIM);
    mk.n.setAttribute("opacity",on?"1":".7");mk.t.setAttribute("opacity",on?"1":".55");});
  draw(dt);
  fxc.style.opacity=io;
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
